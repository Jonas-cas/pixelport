<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solitär – PixelPort</title>

  <script src="../../js/theme.js"></script>

  <link rel="stylesheet" href="../../css/themes.css" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/game-screens.css" />
  <link rel="stylesheet" href="../../css/game-theme-light.css" />
  <link rel="stylesheet" href="solitaire.css" />
</head>
<!-- data-game-theme="light": Kartenspiele bekommen den hellen, farbenfrohen
     Look (css/game-theme-light.css), unabhängig vom Dark-/Bright-Mode. -->
<body data-game-theme="light">
  <header class="site-header">
    <a class="back-link" href="../../category.html?id=kartenspiele">← Kartenspiele</a>
    <a class="icon-button" href="../../settings.html" aria-label="Einstellungen" title="Einstellungen">⚙️</a>
  </header>

  <main class="page game-page">
    <section class="page-intro">
      <h1>🂡 Solitär</h1>
    </section>

    <div class="game-root">
      <!-- Vorbildschirm: Schwierigkeit, wird von game-screens.js befüllt -->
      <section id="setup-screen" class="game-screen"></section>

      <!-- Eigentliches Spiel -->
      <section id="play-screen" class="game-screen game-play-panel sol-play" hidden>
        <p id="sol-status" class="sol-status status-pill"></p>

        <div class="sol-top">
          <div class="sol-stockwaste">
            <div id="sol-stock" class="sol-pile sol-pile--stock"></div>
            <div id="sol-waste" class="sol-pile sol-pile--waste"></div>
          </div>
          <div id="sol-foundations" class="sol-foundations"></div>
        </div>

        <div id="sol-tableau" class="sol-tableau"></div>
      </section>

      <!-- Ergebnis-Bildschirm, wird von game-screens.js befüllt -->
      <section id="result-screen" class="game-screen" hidden></section>
    </div>
  </main>

  <footer class="site-footer">
    <a class="back-link" href="../../category.html?id=kartenspiele">← Zurück zu Kartenspiele</a>
  </footer>

  <script src="../../js/game-screens.js"></script>
  <script src="solitaire.js"></script>
</body>
</html>
